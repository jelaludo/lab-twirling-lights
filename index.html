<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twirling Lights</title>
  <meta name="description" content="A lab of gravitational attractors: particles of light spiralling into wormholes, yin-yang orbits, comets and explosions.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.35' stop-color='%23ffc58a'/%3E%3Cstop offset='1' stop-color='%23b03fc9' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='26' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage" aria-label="Particle attractor simulation"></canvas>

  <div id="hud">
    <div class="title">Twirling Lights</div>
    <div id="hud-stats"></div>
    <div class="hint">drag attract · shift-drag repel · ⌥-drag orbit view · scroll zoom · H hide</div>
  </div>

  <aside id="panel" class="panel">
    <header class="panel-head">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Attractor lab</h1>
          <p>Light, gravity, time</p>
        </div>
      </div>
      <button class="icon-btn" type="button" data-action="hide" title="Hide everything (H)" aria-label="Hide panel">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="presets" aria-label="Presets"></div>
    <div class="scroll"></div>
    <footer class="panel-foot">
      <button type="button" data-action="random" title="Randomize everything (X)">Randomize <kbd>X</kbd></button>
      <button type="button" data-action="snapshot" title="Save a PNG (S)">Snapshot <kbd>S</kbd></button>
      <button type="button" data-action="link" title="Copy a link that recreates this scene">Copy link</button>
      <button type="button" data-action="revert" title="Back to the preset's values">Revert</button>
    </footer>
  </aside>

  <nav id="dock" aria-label="Events"></nav>
  <button id="show-ui" type="button" title="Show controls (H)">Controls</button>
  <div id="toast" role="status"></div>
  <div id="error" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
