<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An exploration of cosmic beauty, from abstract particle dances to nebulae and the light around a black hole.">
<meta name="theme-color" content="#08090e">
<title>Twirling Lights — Cosmic beauty lab</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header class="lab-header">
 <div class="identity"><strong>Twirling Lights <span> / cosmic beauty lab</span></strong><p>Light, gravity, imagination. From abstract dances to astronomical forms.</p></div>
 <nav role="tablist" aria-label="Experiments">
  <button id="tab-attractor" role="tab" aria-controls="scene-attractor" aria-selected="true" data-scene="attractor">Attractor <small>Abstract</small></button>
  <button id="tab-cosmos" role="tab" aria-controls="scene-cosmos" aria-selected="false" tabindex="-1" data-scene="cosmos">Cosmos <small>Astronomical</small></button>
  <button id="tab-accretion" role="tab" aria-controls="scene-accretion" aria-selected="false" tabindex="-1" data-scene="accretion">Accretion <small>Light & gravity</small></button>
  <button id="tab-veil" role="tab" aria-controls="scene-veil" aria-selected="false" tabindex="-1" data-scene="veil">Veil Nebula <small>Ribbons & shells</small></button>
  <button id="tab-bloom" role="tab" aria-controls="scene-bloom" aria-selected="false" tabindex="-1" data-scene="bloom">Stellar Bloom <small>Spiral petals</small></button>
  <button id="tab-worlds" role="tab" aria-controls="scene-worlds" aria-selected="false" tabindex="-1" data-scene="worlds">Ring Worlds <small>Gas giants</small></button>
  <button id="tab-binary" role="tab" aria-controls="scene-binary" aria-selected="false" tabindex="-1" data-scene="binary">Binary Stars <small>Orbiting suns</small></button>
 </nav>
 <div class="exports"><button id="copy">Copy code</button><button id="download">Export HTML ↓</button></div>
</header>
<main id="experiments"></main>
<div id="status" role="status"></div>
<dialog id="code-dialog"><form method="dialog"><strong>Standalone scene HTML</strong><button aria-label="Close">Close</button></form><p>Current settings are included. Copy this code into an .html file and open it in a browser.</p><textarea aria-label="Scene HTML code" spellcheck="false" readonly></textarea><button id="select-code">Select all code</button></dialog>
<script type="module" src="src/lab.js"></script>
</body>
</html>
