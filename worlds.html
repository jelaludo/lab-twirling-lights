<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ring Worlds — Twirling Lights</title><link rel="stylesheet" href="celestial.css"></head>
<body><canvas aria-label="Ring Worlds visualization"></canvas><div id="cap"><h1></h1><p></p></div><div id="ui" aria-label="Color and shape presets"></div>
<script type="application/json" id="scene-config">{"title": "Ring Worlds", "description": "Banded gas giants, delicate rings, and atmospheric light.", "own": true, "presets": [{"t": "Amber giant", "c": [0.3, 0.35], "values": {"colorA": "#aa673c", "colorB": "#ffe0a0", "morph": 1}}, {"t": "Glacial world", "c": [0.3, 0.35], "values": {"colorA": "#285ca1", "colorB": "#b5f5ef", "morph": 2}}, {"t": "Violet dusk", "c": [0.3, 0.35], "values": {"colorA": "#542b81", "colorB": "#e5aed0", "morph": 0}}]}</script>
<script id="scene-settings" type="application/json">{}</script>
<script type="x-shader" id="common">
precision highp float;
uniform vec2 R;uniform float T;uniform vec2 C;uniform float Exposure;uniform float Zoom;uniform float StarGain;uniform vec3 ColorA;uniform vec3 ColorB;uniform float Detail;uniform float Density;uniform float Morph;
float h1(float n){return fract(sin(n)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n3(vec3 x){vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);float n=p.x+p.y*57.+p.z*113.;
 return mix(mix(mix(h1(n),h1(n+1.),f.x),mix(h1(n+57.),h1(n+58.),f.x),f.y),
            mix(mix(h1(n+113.),h1(n+114.),f.x),mix(h1(n+170.),h1(n+171.),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
void camera(float D,out vec3 ro,out vec3 rd){
 vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
 ro=D*vec3(sin(C.x)*cos(C.y),sin(C.y),-cos(C.x)*cos(C.y));
 vec3 f=normalize(-ro),r=normalize(cross(vec3(0,1,0),f)),u=cross(f,r);
 rd=normalize(f+.9/Zoom*(uv.x*r+uv.y*u));}
vec3 stars(vec3 d){vec2 s=floor(vec2(atan(d.z,d.x),asin(clamp(d.y,-1.,1.)))*140.);return vec3(.9,.95,1.)*step(.996,h2(s))*h2(s+3.)*.8*StarGain;}
float glow(vec3 ro,vec3 rd,vec3 c,float k){vec3 o=c-ro;float t=max(dot(o,rd),0.);float d=length(o-rd*t);return k/(d*d+k*.05);}
vec3 tm(vec3 c){return pow(1.-exp(-c*1.3*Exposure),vec3(.85));}
</script>
<script type="x-shader" id="scene">
vec2 hit(vec3 ro,vec3 rd,float radius){float b=dot(ro,rd),q=b*b-dot(ro,ro)+radius*radius;if(q<0.)return vec2(-1.);return vec2(-b-sqrt(q),-b+sqrt(q));}
void main(){vec3 ro,rd;camera(8.,ro,rd);vec3 col=stars(rd);vec3 light=normalize(vec3(-3.,4.,-5.));
 vec2 sphere=hit(ro,rd,1.65);float depth=1.e5;
 if(sphere.x>0.){depth=sphere.x;vec3 p=ro+rd*depth,n=normalize(p);vec3 q=p;q.xz*=rot(T*.045);
 float turbulence=fbm(q*Detail*2.);float bands=.5+.5*sin(p.y*(10.+Morph*4.)+turbulence*5.);
 vec3 albedo=mix(ColorA,ColorB,bands);float diffuse=max(dot(n,light),0.);
 col=albedo*(.06+diffuse*1.4);col+=ColorB*pow(1.-max(dot(n,-rd),0.),3.)*.7;
 }
 // A thin ring plane, with gaps and the planet's shadow.
 if(abs(rd.y)>.0001){float t=-ro.y/rd.y;vec3 p=ro+rd*t;float r=length(p.xz);
 if(t>0.&&t<depth&&r>2.05&&r<3.5){float grain=.5+.5*sin(r*110.+fbm(p*Detail)*4.);
 float gap=1.-.85*exp(-pow((r-(2.6+Morph*.1))/.07,2.));
 float alpha=clamp((.25+.45*grain)*Density*gap,0.,.95);
 vec2 shadow=hit(p+light*.01,light,1.65);float shade=shadow.y>0.?.18:1.;
 col=mix(col,mix(ColorA,ColorB,grain)*shade,alpha);}}
 float impact=length(cross(ro,rd));float halo=exp(-max(impact-1.65,0.)*12.)*step(1.65,impact);
 col+=ColorB*halo*.18;gl_FragColor=vec4(tm(col),1.);}
</script>
<script type="x-shader" id="vol">
void main(){vec3 ro,rd;camera(DIST,ro,rd);vec3 col=vec3(0.);float tr=1.;
 float b=dot(ro,rd),c=dot(ro,ro)-RB*RB,q=b*b-c;
 if(q>0.){q=sqrt(q);float t0=max(-b-q,0.),t1=-b+q,dt=(t1-t0)/float(STEPS),t=t0+dt*h2(gl_FragCoord.xy);
  for(int i=0;i<STEPS;i++){vec4 s=scene(ro+rd*t);col+=tr*s.rgb*dt;tr*=exp(-s.a*dt);if(tr<.02)break;t+=dt;}}
 col+=tr*bg(ro,rd);
 gl_FragColor=vec4(tm(col),1.);}
</script>
<script src="src/celestial.js"></script></body></html>
